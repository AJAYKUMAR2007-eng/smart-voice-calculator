<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Voice Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #13271d;
    --housing: #1b3a2b;
    --paper: #f4ecd8;
    --paper-edge: #cabb92;
    --ink: #2e2417;
    --ink-soft: #8a7a5c;
    --brass: #c98a43;
    --brass-dark: #8f5e28;
    --key-body: #1f4636;
    --key-hi: #2c5c48;
    --danger: #b2603f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: var(--bg);
    color: var(--paper);
    font-family:'Space Grotesk', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .app{ width:100%; max-width:380px; }
  .plate{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px;
  }
  .plate-text{ font-size:15px; color:#d8cdae; letter-spacing:0.01em; }
  .plate-text b{ color:var(--paper); }
  .levers{ display:flex; gap:10px; }
  .lever{
    width:46px; height:46px; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, var(--key-hi), var(--key-body) 70%);
    border:1px solid #0e2018;
    box-shadow: 0 3px 0 #0e2018, inset 0 1px 0 rgba(255,255,255,0.08);
    color: var(--brass);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .lever svg{ width:18px; height:18px; }
  .lever.listening{
    color:#1a1204; background: var(--brass);
    box-shadow: 0 3px 0 var(--brass-dark), 0 0 0 5px rgba(201,138,67,0.18);
  }
  .tape{
    background: var(--paper);
    color: var(--ink);
    padding: 18px 16px 14px;
    position:relative;
  }
  .perf-bottom{
    height:8px;
    background-image: radial-gradient(circle, var(--bg) 3.4px, transparent 3.6px);
    background-size: 14px 8px;
    background-position: -3px 0;
  }
  .heard{
    font-family:'Special Elite', monospace;
    font-size:12px; font-style:italic; color:var(--ink-soft);
    min-height:15px; overflow-wrap:anywhere;
  }
  .expression{
    font-family:'Special Elite', monospace;
    font-size:14px; color:var(--ink-soft);
    text-align:right; min-height:17px; overflow-wrap:anywhere;
  }
  .result{
    font-family:'Special Elite', monospace;
    font-size:36px; text-align:right; letter-spacing:-0.01em;
    overflow-wrap:anywhere;
  }
  .keys{
    background: var(--housing);
    padding:16px 12px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    border-left:1px solid #0e2018; border-right:1px solid #0e2018;
  }
  button.key{
    font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:17px;
    aspect-ratio:1; border-radius:50%; border:none; cursor:pointer;
    background: radial-gradient(circle at 32% 28%, #fbf6ea, #e7dcc3 75%);
    color: var(--ink);
    box-shadow: 0 4px 0 #b7a97f, inset 0 1px 0 rgba(255,255,255,0.6);
  }
  button.key:active{ transform: translateY(3px); box-shadow: 0 1px 0 #b7a97f; }
  button.key.op{
    background: radial-gradient(circle at 32% 28%, var(--key-hi), var(--key-body) 75%);
    color:#d9e8de;
    box-shadow: 0 4px 0 #0e2018, inset 0 1px 0 rgba(255,255,255,0.1);
  }
  button.key.op:active{ box-shadow: 0 1px 0 #0e2018; }
  button.key.accent{
    background: radial-gradient(circle at 32% 28%, #e3a75c, var(--brass) 75%);
    color:#2a1a04;
    box-shadow: 0 4px 0 var(--brass-dark), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  button.key.accent:active{ box-shadow: 0 1px 0 var(--brass-dark); }
  button.key.wide{ aspect-ratio:auto; border-radius:24px; grid-column:span 2; }
  button.key.ghost{
    background: radial-gradient(circle at 32% 28%, #c97456, var(--danger) 75%);
    color:#2a0e04;
    box-shadow: 0 4px 0 #7a3d28, inset 0 1px 0 rgba(255,255,255,0.2);
  }
  button.key.ghost:active{ box-shadow: 0 1px 0 #7a3d28; }
  .roll{
    background: var(--paper); color: var(--ink);
    padding: 14px 16px 16px;
    border-radius: 0 0 6px 6px;
  }
  .roll-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:8px;
  }
  .roll-title{ font-size:12px; color:var(--ink-soft); }
  .clear-history{
    background:none; border:none; color:var(--danger);
    font-family:'Space Grotesk', sans-serif; font-size:12px; cursor:pointer; padding:2px 4px;
  }
  .history-list{
    display:flex; flex-direction:column; gap:6px;
    max-height:130px; overflow-y:auto;
    font-family:'Special Elite', monospace;
  }
  .history-item{
    font-size:12.5px; display:flex; justify-content:space-between;
    border-bottom:1px dashed var(--paper-edge); padding-bottom:5px; color:var(--ink-soft);
  }
  .history-item span:last-child{ color:var(--ink); }
  .history-empty{ font-size:12px; font-style:italic; color:var(--ink-soft); }
  .hint{
    margin-top:12px; font-size:11px; color:#a89873;
    text-align:center; line-height:1.5;
  }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--paper-edge); border-radius:3px; }
</style>
</head>
<body>

<div class="app">
  <div class="plate">
    <div class="plate-text"><b>Smart</b> Voice Calculator</div>
    <div class="levers">
      <button class="lever" id="speakBtn" title="Repeat answer" aria-label="Repeat answer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="4 8 8 8 13 4 13 20 8 16 4 16 4 8"></polygon>
          <path d="M17 8a5 5 0 0 1 0 8"></path>
          <path d="M19.5 5.5a9 9 0 0 1 0 13"></path>
        </svg>
      </button>
      <button class="lever" id="micBtn" title="Speak a calculation" aria-label="Start voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="tape">
    <div class="heard" id="heard"></div>
    <div class="expression" id="expression">0</div>
    <div class="result" id="result">0</div>
  </div>
  <div class="perf-bottom"></div>

  <div class="keys" id="keys">
    <button class="key ghost" data-action="clear">C</button>
    <button class="key op" data-action="backspace">⌫</button>
    <button class="key op" data-val="%">%</button>
    <button class="key op" data-val="/">÷</button>

    <button class="key" data-val="7">7</button>
    <button class="key" data-val="8">8</button>
    <button class="key" data-val="9">9</button>
    <button class="key op" data-val="*">×</button>

    <button class="key" data-val="4">4</button>
    <button class="key" data-val="5">5</button>
    <button class="key" data-val="6">6</button>
    <button class="key op" data-val="-">−</button>

    <button class="key" data-val="1">1</button>
    <button class="key" data-val="2">2</button>
    <button class="key" data-val="3">3</button>
    <button class="key op" data-val="+">+</button>

    <button class="key wide" data-val="0">0</button>
    <button class="key" data-val=".">.</button>
    <button class="key accent" data-action="equals">=</button>
  </div>

  <div class="perf-bottom"></div>
  <div class="roll">
    <div class="roll-head">
      <div class="roll-title">History</div>
      <button class="clear-history" id="clearHistoryBtn">Clear</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="hint">Tap the mic and say something like "twelve plus eight". Tap the speaker lever to hear the answer again.</div>
</div>

<script>
(function(){
  const exprEl = document.getElementById('expression');
  const resultEl = document.getElementById('result');
  const heardEl = document.getElementById('heard');
  const micBtn = document.getElementById('micBtn');
  const speakBtn = document.getElementById('speakBtn');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  const keys = document.getElementById('keys');
  const historyList = document.getElementById('historyList');

  let expr = '';

  function render(){
    exprEl.textContent = expr || '0';
    const val = safeEval(expr);
    resultEl.textContent = val === null ? '' : formatNum(val);
  }
  function formatNum(n){
    if (!isFinite(n)) return 'Error';
    const rounded = Math.round(n * 1e9) / 1e9;
    return rounded.toString();
  }
  function safeEval(str){
    if (!str) return null;
    try{
      const tokens = tokenize(str);
      if (!tokens.length) return null;
      const pos = {i:0};
      const val = parseExpr(tokens, pos);
      if (pos.i !== tokens.length) return null;
      return val;
    }catch(e){ return null; }
  }
  function tokenize(str){
    const out = [];
    const re = /\d+\.?\d*|\.\d+|[+\-*/%()]/g;
    let m;
    while((m = re.exec(str))) out.push(m[0]);
    return out;
  }
  function parseExpr(t, p){
    let left = parseTerm(t, p);
    while (t[p.i] === '+' || t[p.i] === '-'){
      const op = t[p.i++];
      const right = parseTerm(t, p);
      left = op === '+' ? left + right : left - right;
    }
    return left;
  }
  function parseTerm(t, p){
    let left = parseFactor(t, p);
    while (t[p.i] === '*' || t[p.i] === '/' || t[p.i] === '%'){
      const op = t[p.i++];
      const right = parseFactor(t, p);
      if (op === '*') left = left * right;
      else if (op === '/') left = left / right;
      else left = left % right;
    }
    return left;
  }
  function parseFactor(t, p){
    if (t[p.i] === '-'){ p.i++; return -parseFactor(t, p); }
    if (t[p.i] === '('){
      p.i++;
      const v = parseExpr(t, p);
      if (t[p.i] === ')') p.i++;
      return v;
    }
    const tok = t[p.i];
    if (tok === undefined || isNaN(parseFloat(tok))) throw new Error('bad token');
    p.i++;
    return parseFloat(tok);
  }

  keys.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const val = btn.dataset.val;
    const action = btn.dataset.action;
    if (val !== undefined) expr += val;
    else if (action === 'clear') expr = '';
    else if (action === 'backspace') expr = expr.slice(0, -1);
    else if (action === 'equals') commit();
    render();
  });

  function commit(fromVoice){
    const val = safeEval(expr);
    if (val === null || expr === '') return;
    const formatted = formatNum(val);
    addHistory(expr, formatted);
    expr = formatted;
    render();
    speak(fromVoice ? ('The answer is ' + formatted) : formatted);
  }

  function addHistory(exp, val){
    const list = JSON.parse(localStorage.getItem('svc_history') || '[]');
    list.unshift({exp, val});
    localStorage.setItem('svc_history', JSON.stringify(list.slice(0, 20)));
    renderHistory();
  }
  function renderHistory(){
    const list = JSON.parse(localStorage.getItem('svc_history') || '[]');
    if (!list.length){
      historyList.innerHTML = '<div class="history-empty">No calculations yet.</div>';
      return;
    }
    historyList.innerHTML = list.map(item =>
      `<div class="history-item"><span>${escapeHtml(item.exp)}</span><span>${escapeHtml(item.val)}</span></div>`
    ).join('');
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  clearHistoryBtn.addEventListener('click', () => {
    localStorage.removeItem('svc_history');
    renderHistory();
  });

  function speak(text){
    if (!('speechSynthesis' in window) || !text) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }
  speakBtn.addEventListener('click', () => {
    const current = resultEl.textContent || exprEl.textContent || '0';
    speak(current);
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognition = null;

  if (SpeechRecognition){
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      micBtn.classList.add('listening');
      heardEl.textContent = 'Listening…';
    };
    recognition.onend = () => {
      recognizing = false;
      micBtn.classList.remove('listening');
    };
    recognition.onerror = () => {
      recognizing = false;
      micBtn.classList.remove('listening');
      heardEl.textContent = 'Could not hear that — try again.';
    };
    recognition.onresult = (e) => {
      const said = e.results[0][0].transcript;
      heardEl.textContent = '"' + said + '"';
      const parsed = wordsToExpression(said);
      if (parsed){
        expr = parsed;
        commit(true);
      } else {
        heardEl.textContent = '"' + said + '" — didn\'t catch a calculation.';
      }
    };
  } else {
    micBtn.style.display = 'none';
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    if (recognizing) recognition.stop();
    else recognition.start();
  });

  function wordsToExpression(said){
    let s = ' ' + said.toLowerCase().trim() + ' ';
    const numberWords = {
      zero:'0', one:'1', two:'2', three:'3', four:'4', five:'5', six:'6',
      seven:'7', eight:'8', nine:'9', ten:'10', eleven:'11', twelve:'12',
      thirteen:'13', fourteen:'14', fifteen:'15', sixteen:'16', seventeen:'17',
      eighteen:'18', nineteen:'19', twenty:'20', thirty:'30', forty:'40',
      fifty:'50', sixty:'60', seventy:'70', eighty:'80', ninety:'90'
    };
    const scaleWords = { hundred:100, thousand:1000, million:1000000 };
    const opReplacements = [
      [/\bdivided by\b/g, ' / '],
      [/\bdivide by\b/g, ' / '],
      [/\bmultiplied by\b/g, ' * '],
      [/\btimes\b/g, ' * '],
      [/\bplus\b/g, ' + '],
      [/\badded to\b/g, ' + '],
      [/\bminus\b/g, ' - '],
      [/\bsubtract(ed)? from\b/g, ' - '],
      [/\bmodulo\b/g, ' % '],
      [/\bmod\b/g, ' % '],
      [/\bpercent of\b/g, ' * 0.01 * '],
      [/\bpercent\b/g, ' * 0.01 '],
      [/\bpoint\b/g, ' . '],
      [/\bopen bracket\b/g, ' ( '],
      [/\bclose bracket\b/g, ' ) ']
    ];
    for (const [re, rep] of opReplacements) s = s.replace(re, rep);
    s = s.replace(/\band\b/g, ' ');
    const tokens = s.split(/\s+/).filter(Boolean);
    const out = [];
    let i = 0;
    while (i < tokens.length){
      const tok = tokens[i];
      if (numberWords[tok] !== undefined || scaleWords[tok] !== undefined){
        let total = 0, current = 0;
        while (i < tokens.length && (numberWords[tokens[i]] !== undefined || scaleWords[tokens[i]] !== undefined)){
          const t = tokens[i];
          if (numberWords[t] !== undefined){
            current += parseInt(numberWords[t], 10);
          } else {
            current = current === 0 ? scaleWords[t] : current * scaleWords[t];
            if (scaleWords[t] >= 1000){ total += current; current = 0; }
          }
          i++;
        }
        out.push(String(total + current));
      } else {
        out.push(tok);
        i++;
      }
    }
    let joined = out.join(' ');
    joined = joined.replace(/(\d)\s*\.\s*(\d)/g, '$1.$2');
    joined = joined.replace(/[^0-9+\-*/%.() ]/g, ' ');
    joined = joined.replace(/\s+/g, ' ').trim();
    return safeEval(joined) !== null ? joined : null;
  }

  renderHistory();
  render();
})();
</script>

</body>
</html>
